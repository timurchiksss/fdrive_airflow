x-airflow-common: &airflow-common
  build: .
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    FDRIVE_PROJECT_ROOT: /opt/airflow
    PYTHONPATH: "/opt/airflow:/opt/airflow/parsers:/opt/airflow/scripts:/opt/airflow/matching:/opt/airflow/parsers/code for parser"
    RAW_PGHOST: ${RAW_PGHOST:-postgres}
    RAW_PGPORT: ${RAW_PGPORT:-5432}
    RAW_PGUSER: ${RAW_PGUSER:-airflow}
    RAW_PGPASSWORD: ${RAW_PGPASSWORD:-airflow}
    RAW_PGDATABASE: ${RAW_PGDATABASE:-airflow}
    MARKETPLACE_PGDATABASE: ${MARKETPLACE_PGDATABASE:-fdrive_marketplace_v2}
    MARKETPLACE_MAINTENANCE_DATABASE: ${MARKETPLACE_MAINTENANCE_DATABASE:-postgres}
    RAW_SCHEMA: ${RAW_SCHEMA:-raw}
    CLEAN_SCHEMA: ${CLEAN_SCHEMA:-cleanned}
    MATCH_SCHEMA: ${MATCH_SCHEMA:-matching}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./parsers:/opt/airflow/parsers
    - ./scripts:/opt/airflow/scripts
    - ./matching:/opt/airflow/matching
    - ./cleaning_all.py:/opt/airflow/cleaning_all.py
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./secrets:/opt/airflow/secrets
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      retries: 5
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
      mkdir -p /opt/airflow/data /opt/airflow/logs /opt/airflow/plugins /opt/airflow/secrets &&
      airflow db migrate &&
      airflow users create
        --username admin
        --password admin
        --firstname Admin
        --lastname User
        --role Admin
        --email admin@example.com || true
      "

volumes:
  postgres-db-volume:
